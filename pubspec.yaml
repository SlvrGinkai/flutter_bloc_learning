name: flutter_bloc_learning
description: >
  A small learning project comparing the Cubit and Bloc approaches
  from the flutter_bloc package, implemented as two versions of the
  same counter feature.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
